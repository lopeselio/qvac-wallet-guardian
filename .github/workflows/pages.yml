name: Pages
# Builds the hosted, rules-only demo and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://wallet-guardian.qvac.lopeselio.online
on:
  push:
    branches: [main]
    paths: [ui/**, site/**, src/**, examples/**, scripts/**, package.json, package-lock.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - name: Push site/dist to gh-pages
        run: |
          cd site/dist
          touch .nojekyll
          # This job replaces the whole branch, so it writes the custom domain too.
          echo wallet-guardian.qvac.lopeselio.online > CNAME
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy hosted demo from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
